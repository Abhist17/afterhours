[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

# One keypair, one id, every cluster: the address in target/deploy decides.
[programs.localnet]
afterhours = "3hqhzG55EkCjhUYmmCxHWyNGkXi3XJSTEWimkTzVifri"

[programs.devnet]
afterhours = "3hqhzG55EkCjhUYmmCxHWyNGkXi3XJSTEWimkTzVifri"

[programs.mainnet]
afterhours = "3hqhzG55EkCjhUYmmCxHWyNGkXi3XJSTEWimkTzVifri"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""
