[package]
name = "afterhours"
version = "0.1.0"
description = "Afterhours — on-chain policy and risk snapshots for tokenized stock portfolios"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "afterhours"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = ["dep:solana-program"]
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "0.32.1"
solana-program = { version = "2.3", optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
