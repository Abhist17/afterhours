[workspace]
members = ["programs/*"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
# Size over speed: rent is paid per byte, and nothing here is hot.
opt-level = "z"
panic = "abort"
strip = true
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
